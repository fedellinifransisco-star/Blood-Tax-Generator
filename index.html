<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BLOOD TAX | Ref Dashboard</title>
    <style>
        :root { --danger: #ff4444; --bg: #0a0a0a; --card-bg: #1a1a1a; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { color: var(--danger); letter-spacing: 5px; border-bottom: 2px solid var(--danger); padding-bottom: 10px; }
        
        #display-area { background: var(--card-bg); border: 2px solid #333; border-radius: 10px; padding: 20px; margin: 20px 0; width: 300px; text-align: center; box-shadow: 0 0 20px rgba(255, 68, 68, 0.2); }
        .stat { font-size: 1.2rem; margin-bottom: 10px; color: #888; }
        .val { font-size: 2.5rem; font-weight: bold; color: var(--danger); }

        .deck-container { background: #111; padding: 15px; border-radius: 8px; margin-bottom: 15px; width: 90%; max-width: 500px; border-left: 4px solid var(--danger); }
        .deck-label { font-weight: bold; margin-bottom: 10px; display: block; color: #aaa; text-transform: uppercase; font-size: 0.8rem; }
        .deck { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        
        .card { width: 35px; height: 50px; background: var(--card-bg); border: 1px solid #444; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .card:hover { border-color: var(--danger); }
        .card.used { background: #000; color: #333; border-color: #222; text-decoration: line-through; opacity: 0.5; cursor: default; }

        button { background: var(--danger); color: white; border: none; padding: 15px 30px; font-size: 1rem; font-weight: bold; border-radius: 5px; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #cc0000; transform: scale(1.05); }
    </style>
</head>
<body>

    <h1>THE BLOOD TAX</h1>

    <div id="display-area">
        <div class="stat">TARGET TAX</div>
        <div id="tax-val" class="val">--</div>
        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
        <div class="stat">GREED LIMIT</div>
        <div id="limit-val" class="val" style="color: #ff8800;">--</div>
    </div>

    <button onclick="generateRound()">Generate Next Round</button>

    <div class="deck-container">
        <span class="deck-label">Player 1 Deck (Used numbers will be skipped)</span>
        <div id="p1-deck" class="deck"></div>
    </div>

    <div class="deck-container">
        <span class="deck-label">Player 2 Deck (Used numbers will be skipped)</span>
        <div id="p2-deck" class="deck"></div>
    </div>

    <script>
        // Initialize decks
        function setupDeck(id) {
            const container = document.getElementById(id);
            for(let i=1; i<=10; i++) {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerText = i;
                div.onclick = function() { this.classList.toggle('used'); };
                container.appendChild(div);
            }
        }

        function generateRound() {
            // Get unused numbers from the UI
            const p1 = Array.from(document.querySelectorAll('#p1-deck .card:not(.used)')).map(c => parseInt(c.innerText));
            const p2 = Array.from(document.querySelectorAll('#p2-deck .card:not(.used)')).map(c => parseInt(c.innerText));

            if (p1.length === 0 || p2.length === 0) {
                alert("Match finished! One or both players have no cards left.");
                return;
            }

            // Calculate min/max possible sums for the logical range
            const minSum = Math.min(...p1) + Math.min(...p2);
            const maxSum = Math.max(...p1) + Math.max(...p2);

            // Generate Tax within that logical range
            const tax = Math.floor(Math.random() * (maxSum - minSum + 1)) + minSum;
            
            // Greed Limit: range of 1 or 2 above tax as requested
            const limit = tax + (Math.random() < 0.5 ? 1 : 2);

            document.getElementById('tax-val').innerText = tax;
            document.getElementById('limit-val').innerText = limit;
        }

        setupDeck('p1-deck');
        setupDeck('p2-deck');
    </script>
</body>
</html>
